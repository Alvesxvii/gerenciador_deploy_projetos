# Exemplo de configuracao de instancia
# Copie para instances/<nome>.conf e ajuste os valores.
# Arquivos .conf reais devem ficar com chmod 600.

INSTANCE_NAME="example_project"

LOCAL_DIR="/caminho/local/do/projeto"
REMOTE_DIR="/caminho/remoto"

FTP_HOST="ftp.seudominio.com"
FTP_USER="usuario"
FTP_PASS="CHANGE_ME"

FTP_SSL="true"
FTP_VERIFY_CERT="false"

EXCLUDES=(
  ".git/"
  ".github/"
  "*.log"
  "node_modules/"
)
